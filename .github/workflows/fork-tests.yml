name: Fork tests
# Temporary: runs this repository's checks on a fork branch. Not part of any PR.
on:
  push:
    branches: [ci/fork-tests, ci/main-baseline]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx vitest run src/tests/fork-session.test.ts src/tests/create-session-options.test.ts
      - run: npm run test:run
